name: anime-streaming-backend-test

services:
  db:
    image: postgres:15-alpine
    container_name: anime-streaming-backend-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: anime_streaming_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d anime_streaming_test -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=20
      -c fsync=off
      -c synchronous_commit=off

networks:
  default:
    name: anime-streaming-backend-test-network

volumes:
  db-data:
    name: anime-streaming-backend-test-db-data
